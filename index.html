<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Smart Reminder</title>
<meta name="theme-color" content="#14246b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smart Reminder">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@600;700&display=swap">
<style>
/* Layout: single-column mobile app, sticky header, floating glass nav pill at the bottom. Navy + cyan palette matched to the presentation slides. */
:root{
  --bg:#f1f5fc; --header:#e6eefb; --primary:#14246b; --on-primary:#ffffff; --soft:#e0f6fa; --text:#0e1633; --muted:#5b6785;
  --line:#dde5f3; --card:#ffffff; --field:#f8faff; --chip:#e4f5fa; --tint:#eaf8fb; --hero:#e9f5fb; --hero-text:#34456e;
  --wheel-muted:#a3aecb; --faint:#7782a1; --switch-off:#d0d5dd; --danger:#d4614a; --warn-bg:#fff4e5; --warn-line:#f5c26b; --warn-text:#8a5a00;
  --nav-bg:rgba(255,255,255,.72); --nav-line:rgba(255,255,255,.8); --nav-on:rgba(20,36,107,.14); --scrim:rgba(0,0,0,.35);
  --shadow:0 8px 24px rgba(10,20,64,.18);
  --font-display:"Prompt","Noto Sans Thai",system-ui,sans-serif; --font-body:"Noto Sans Thai",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070c28; --header:#0b1238; --primary:#2de2e6; --on-primary:#04112e; --soft:#14214f; --text:#eaf2ff; --muted:#9aa9d1;
  --line:#1c2860; --card:#0f1840; --field:#0b1236; --chip:#15235a; --tint:#122050; --hero:#142a63; --hero-text:#c3d0f0;
  --wheel-muted:#3f4d85; --faint:#7886b5; --switch-off:#2a3566; --danger:#e8806a; --warn-bg:#33291a; --warn-line:#6b5420; --warn-text:#f0c987;
  --nav-bg:rgba(15,24,64,.72); --nav-line:rgba(255,255,255,.16); --nav-on:rgba(45,226,230,.18); --scrim:rgba(0,0,0,.6);
  --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#070c28; --header:#0b1238; --primary:#2de2e6; --on-primary:#04112e; --soft:#14214f; --text:#eaf2ff; --muted:#9aa9d1;
  --line:#1c2860; --card:#0f1840; --field:#0b1236; --chip:#15235a; --tint:#122050; --hero:#142a63; --hero-text:#c3d0f0;
  --wheel-muted:#3f4d85; --faint:#7886b5; --switch-off:#2a3566; --danger:#e8806a; --warn-bg:#33291a; --warn-line:#6b5420; --warn-text:#f0c987;
  --nav-bg:rgba(15,24,64,.72); --nav-line:rgba(255,255,255,.16); --nav-on:rgba(45,226,230,.18); --scrim:rgba(0,0,0,.6);
  --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--header);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{display:inline-block;vertical-align:middle;flex:none}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
p{margin:0}

.shell{max-width:560px;margin:0 auto}
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.header-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0}
.brand h1{font-size:20px;display:flex;align-items:center;gap:8px;color:var(--text)}
.brand p{font-size:12.5px;color:var(--muted)}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);position:relative}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:1.5px solid var(--card)}
.avatar{border-radius:50%;display:grid;place-items:center;flex:none}

main{padding-block:14px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.card h2{font-size:17px;margin-bottom:8px}
.h-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--primary)}
.h-row h2{margin:0;color:var(--text)}
.p{color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--primary);font-weight:600;font-size:13px;border-radius:99px;padding:4px 12px;margin-bottom:10px}

.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border-radius:14px;padding:12px 16px;font-weight:600;margin-top:10px;min-height:46px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.link{font-size:13px;color:var(--faint);text-decoration:underline;margin-top:8px;display:inline-block;padding:6px 0}

.top-row{display:grid;grid-template-columns:1.15fr 1fr;gap:10px}
.hero{position:relative;overflow:hidden;background:var(--hero);border-radius:20px;padding:14px;min-height:175px;min-width:0}
.hero.tall{min-height:215px}
.hero .greet{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:17px;color:#0e1633}
:root[data-theme="dark"] .hero .greet,:root[data-theme="dark"] .hero p{color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .greet,:root:not([data-theme="light"]) .hero p{color:var(--text)}}
.hero p{font-size:13px;color:var(--hero-text);margin-top:4px;line-height:1.6;max-width:90%}
.hero .art{position:absolute;right:-6px;bottom:-8px;opacity:.9;color:var(--primary)}
.hero .art .ic{width:92px;height:92px;stroke-width:1.2}
.hero .art.has-img{position:static;display:flex;justify-content:center;width:100%;margin-top:8px;opacity:1}
/* รูปบนการ์ดทักทาย: อยู่กลางการ์ด กว้างเต็มการ์ด แต่ไม่เกิน --hero-img (ลดเลขถ้าอยากให้เล็กลง) */
.hero{--hero-img:400px}
.hero .art img{display:block;width:100%;max-width:var(--hero-img);height:auto;max-height:none;object-fit:contain}
/* เมื่อมีรูป: ให้สีการ์ดเท่ากับสีพื้นของรูป (แก้ที่ --hero-bg-img ถ้าสีพื้นรูปต่างไป) ตัวอักษรใช้สีเข้มทั้งสองโหมด */
.hero{--hero-bg-img:#e9f5fb}
.hero:has(.art.has-img:not(.noimg)){background:var(--hero-bg-img)}
.hero:has(.art.has-img:not(.noimg)) .greet{color:#0e1633}
.hero:has(.art.has-img:not(.noimg)) p{color:#34456e}
.hero .greet,.hero p{position:relative;z-index:1}
.hero .art{z-index:0}
.hero .art .fb{display:none}
.hero .art.noimg .fb{display:block}
.hero .art.noimg img{display:none}
.brand-logo{width:30px;height:30px;border-radius:8px;display:block;flex:none}
.sum{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;min-width:0}
.sum h3{font-size:15px}
.sum .sub{font-size:12px;color:var(--muted);margin:2px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;color:var(--muted)}
.sum-row i{width:8px;height:8px;border-radius:50%;display:block}
.sum-row span{flex:1}
.sum-row b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}


.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;min-width:0}
.tile .ti{width:58px;height:58px;border-radius:18px;display:grid;place-items:center}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rem{display:flex;align-items:center;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.rem.on{background:var(--bg);border-radius:12px;padding-inline:6px}
.rem-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.rem-time{background:var(--soft);color:var(--primary);font-family:var(--font-display);font-size:19px;border-radius:14px;padding:8px 11px;font-variant-numeric:tabular-nums}
.rem-body{min-width:0;flex:1}
.rem-title{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.rem-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rem-body .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{padding:8px;display:grid;place-items:center;border-radius:10px}
.more{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:10px;color:var(--primary);font-weight:600;font-size:14px}

.inrow{display:flex;gap:8px;margin-top:8px}
.input{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:10px 12px;font-size:15px;width:100%}
.input::placeholder{color:var(--faint)}
.go{background:var(--primary);color:var(--on-primary);border-radius:12px;padding:0 14px;font-weight:700;flex:none;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--chip);border-radius:99px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.result{margin-top:10px;padding:12px;border-radius:14px;background:var(--tint)}
.result h3{font-size:16px;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.result li,.det-list li{margin:2px 0}
.result ul,.det-list{margin:6px 0 0;padding-left:20px}
.stat-line{padding:3px 0;color:var(--muted);font-size:14px}
.stat-line b{color:var(--text)}

.title-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.title-row h2{flex:1;margin:0;min-width:0}
.pill{background:var(--soft);color:var(--primary);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--faint);display:grid;place-items:center;flex:none;color:var(--on-primary)}
.cb.on{background:var(--primary);border-color:var(--primary)}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{color:var(--faint);text-decoration:line-through}
.rm{color:var(--faint);padding:6px}
.warn{margin-top:10px;padding:12px;border-radius:12px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text);font-size:14px}
.stats{display:flex;align-items:center;background:var(--bg);border-radius:16px;padding:12px 0;margin-top:16px}
.stats>div{flex:1;text-align:center}
.stats .div{flex:none;width:1px;height:28px;background:var(--line)}
.stats b{font-family:var(--font-display);font-size:18px;display:block}
.stats small{font-size:12px;color:var(--muted)}
.ring{display:block;margin:0 auto}

.label{font-weight:700;margin:16px 0 6px;font-size:15px}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.quick button{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px}
.switch-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.switch{width:50px;height:30px;border-radius:99px;background:var(--switch-off);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.day{height:40px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px}
.day.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.edit-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.edit-item span{flex:1;min-width:0;overflow-wrap:anywhere}

.wheel-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin:12px 0;background:var(--bg);border-radius:18px;overflow:hidden}
.wheel-hl{position:absolute;left:24px;right:24px;height:48px;border-radius:12px;background:var(--soft);pointer-events:none}
.wheel{position:relative;height:240px;width:80px;overflow-y:auto;scroll-snap-type:y mandatory;scroll-padding-block:96px;padding-block:96px;scrollbar-width:none;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:48px;display:grid;place-items:center;scroll-snap-align:start;font-size:24px;color:var(--wheel-muted);font-variant-numeric:tabular-nums}
.wheel div.on{font-size:30px;font-weight:700;color:var(--text)}
.colon{font-size:30px;font-weight:700;margin:0 4px;position:relative}

.nav-pill{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:20;display:flex;justify-content:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-glass{pointer-events:auto;width:100%;max-width:420px;height:68px;display:flex;gap:4px;padding:6px;border-radius:34px;background:var(--nav-bg);border:1px solid var(--nav-line);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.nav-btn{flex:1;border-radius:28px;display:grid;place-items:center;color:var(--text)}
.nav-btn.on{background:var(--nav-on);color:var(--primary)}

.toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:60;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 16px;font-size:14px;max-width:min(90vw,420px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px}
.scrim.menu{align-items:flex-start;justify-content:flex-end;background:rgba(0,0,0,.28)}
.menu-card{width:270px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:calc(env(safe-area-inset-top,0px) + 62px)}
.menu-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-head b{font-family:var(--font-display);font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.menu-head small{color:var(--muted);font-size:12px}
.menu-row{display:flex;align-items:center;gap:10px;padding:12px 0;font-weight:600;width:100%;text-align:left;color:var(--text)}
.menu-row span{flex:1}
.seg {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}
.seg button{border-radius:12px;padding:9px 4px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;width:100%;max-width:440px;max-height:90%;overflow:auto}
.modal-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.modal-head h2{flex:1;font-size:18px;margin:0}
.det-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.det-row span{width:88px;color:var(--muted);flex:none}
.det-row b{flex:1;min-width:0;overflow-wrap:anywhere}
.avatars{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.avatars button{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:2px solid transparent}
.avatars button.on{border-color:var(--primary)}

.ob{text-align:center}
.ob h2{font-size:20px;margin:10px 0 6px}
.ob .left{text-align:left}
.ob-hero{width:170px;height:170px;margin:6px auto;position:relative;display:grid;place-items:center}
.ob-hero i{position:absolute;border-radius:50%;background:var(--soft)}
.ob-hero i:nth-child(1){width:170px;height:170px;opacity:.55}
.ob-hero i:nth-child(2){width:132px;height:132px}
.ob-hero .core{position:relative;width:94px;height:94px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 6px 14px rgba(20,36,107,.35)}
.feat{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.step{display:flex;align-items:center;gap:12px;margin:12px 0;text-align:left}
.step .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;position:relative}
.step .si b{position:absolute;top:-5px;left:-5px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:11px;display:grid;place-items:center}
.perm{margin-top:14px;padding:12px;border-radius:14px;background:var(--tint);text-align:left}
.dots{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--switch-off)}
.dots i.on{width:20px;background:var(--primary)}
.alert-ic{width:64px;height:64px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin:0 auto 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:360px){.top-row{grid-template-columns:1fr}.tiles{gap:4px}.tile .ti{width:50px;height:50px}}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.danger[disabled]{opacity:.5}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
(function(){
"use strict";

/* ---------- storage (per viewer, falls back to memory) ---------- */
var mem = {};
var LS = {
  get: function(k, d){ try { var v = localStorage.getItem("sr:"+k); if (v != null) return JSON.parse(v); } catch(e){} return (k in mem) ? mem[k] : d; },
  set: function(k, v){ mem[k] = v; try { localStorage.setItem("sr:"+k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- icons ---------- */
var P = {
  home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  checksq:'<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',

var BAD_WORDS = ["เหี้ย","ควย","เชี่ย","เย็ดแม่","แม่ง","ระยำ","ส้นตีน","ตอแหล","อีดอก","ดอกทอง","ไอ้สัตว์","ชาติหมา","ไอ้สัส","อีสัส","หำ","ตูด","ก้น","hum","hee","kuy","fuck","shit","bitch","asshole","cunt","pussy","dick","bastard","หี","เย็ด","เย้ด","แตด","หมอย"];
function norm(s){ return s.toLowerCase().replace(/[\s​\-_.,*!?'"()]/g,"").replace(/(.)\1+/g,"$1"); }
function isLatin(w){ return /^[a-z]+$/i.test(w); }
var BAD_THAI = BAD_WORDS.filter(function(w){return !isLatin(w);}).map(norm);
var BAD_LATIN = Array.from(new Set(BAD_WORDS.filter(isLatin).map(function(w){return w.toLowerCase();}))).map(function(w){ return new RegExp("^"+w.split("").map(function(c){return c+"+";}).join("")+"$"); });
function hasProfanity(text){
  var n = norm(text);
  if (BAD_THAI.some(function(w){ return n.indexOf(w) >= 0; })) return true;
  var words = text.toLowerCase().split(/[^a-z]+/).filter(Boolean);
  return words.some(function(w){ return BAD_LATIN.some(function(re){ return re.test(w); }); });
}
function findActivity(text){
  var q = text.trim().toLowerCase(), i;
  for (i=0;i<EXTRA.length;i++){ if (EXTRA[i].keys.some(function(k){return q.indexOf(k)>=0;})) return EXTRA[i]; }
  for (i=0;i<ACTIVITIES.length;i++){ var a = ACTIVITIES[i]; if (MAIN_KEYS[a.name].some(function(k){return q.indexOf(k)>=0;})) return { name:a.name, icon:a.icon, items:DATA[a.name] }; }
  return null;
}

function nextFireDate(t, days){
  if (!t || !days || !days.length) return null;
  var p = t.split(":").map(Number), now = new Date();
  for (var off=0; off<=7; off++){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+off, p[0], p[1], 0, 0);
    if (d > now && days.indexOf(d.getDay()+1) >= 0) return d;
  }
  return null;
}
function lastOccurrence(r, now){
  var p = r.time.split(":").map(Number), n = new Date(now);
  for (var off=0; off<=7; off++){
    var d = new Date(n.getFullYear(), n.getMonth(), n.getDate()-off, p[0], p[1], 0, 0);
    if (d.getTime() <= now && r.days.indexOf(d.getDay()+1) >= 0) return d.getTime();
  }
  return null;
}

function formatRemaining(d){
  if (!d) return null;
  var mins = Math.max(1, Math.round((d - new Date())/60000));
  var dd = Math.floor(mins/1440), hh = Math.floor((mins%1440)/60), mm = mins%60;
  if (dd>0) return "อีก "+dd+" วัน "+hh+" ชม.";
  if (hh>0) return "อีก "+hh+" ชม. "+mm+" นาที";
  return "อีก "+mm+" นาที";
}

  var L = listInfo();

  else if (i < L.base.length){
    var r = Object.assign({}, S.removedItems); r[S.current.name] = L.removed.concat([L.base[i]]); S.removedItems = r; LS.set("removedItems", r);
  } else {

    c[S.current.name] = L.custom.filter(function(_,idx){return idx!==j;}); S.customItems = c; LS.set("customItems", c);
  }

  var next = {};
  Object.keys(S.checked).forEach(function(k){ var n = Number(k); if (n<i) next[n]=S.checked[k]; else if (n>i) next[n-1]=S.checked[k]; });
  S.checked = next; syncProgress(); render();

/* ---------- OneSignal Web Push ---------- */
var OS = null;
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }
function isStandalone(){ return window.navigator.standalone===true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); }
function syncPush(){
  try { S.pushOn = !!(OS && OS.Notifications.permission && OS.User.PushSubscription.optedIn); } catch(e){ S.pushOn = false; }
  S.notifGranted = S.pushOn;
}
function loginPush(){ if (OS && S.user){ try { OS.login(S.user.id); } catch(e){} } }
function initPush(){
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function(OneSignal){
    try {
      await OneSignal.init({ appId: CFG.ONESIGNAL_APP_ID, allowLocalhostAsSecureOrigin: true });
      OS = OneSignal;
      OneSignal.Notifications.addEventListener("click", function(ev){
        var d = (ev.notification && ev.notification.additionalData) || {};
        if (d.reminderId) openFromPush(d.reminderId);
      });
      OneSignal.Notifications.addEventListener("foregroundWillDisplay", function(ev){
        var d = (ev.notification && ev.notification.additionalData) || {};
        if (!d.reminderId) return;
        if (typeof ev.preventDefault === "function") ev.preventDefault();
        fireInApp(d.reminderId);
      });
      loginPush(); syncPush(); render();
    } catch(e){ console.warn("OneSignal init failed", e); }
  });
  
}
function pushHint(){
  if (!("Notification" in window)) return "เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน";
  if (isIOS() && !isStandalone()) return "บน iPhone ต้องเพิ่มลงหน้าจอหลักแล้วเปิดจากไอคอนก่อน";
  if (Notification.permission==="denied") return "ถูกบล็อกไว้ ไปเปิดอนุญาตในตั้งค่าของเบราว์เซอร์สำหรับเว็บนี้";
  return S.pushOn ? "เปิดอยู่ จะเตือนแม้ปิดหน้าเว็บนี้" : "ปิดอยู่";
}
async function enablePush(){
  if (!OS){ toast("ระบบแจ้งเตือนยังไม่พร้อม ลองใหม่อีกครั้ง"); return; }
  if (isIOS() && !isStandalone()){ toast("บน iPhone ต้องเพิ่มลงหน้าจอหลักก่อน"); return; }
  try {
    await OS.Notifications.requestPermission();
    if (OS.Notifications.permission) await OS.User.PushSubscription.optIn();
  } catch(e){ console.warn(e); }
  loginPush(); syncPush();
  toast(S.pushOn ? "เปิดการแจ้งเตือนแล้ว" : "ยังไม่ได้รับอนุญาต เปิดได้ที่ตั้งค่าของเบราว์เซอร์");
  render();
}
async function disablePush(){
  try { if (OS) await OS.User.PushSubscription.optOut(); } catch(e){}
  syncPush(); toast("ปิดการแจ้งเตือนแล้ว"); render();
}
function togglePush(){ if (S.pushOn) disablePush(); else enablePush(); }
function openFromPush(id){
  var r = S.reminders.find(function(x){ return x.id === id; });
  if (r){ S.menuOpen = false; S.detailId = null; openChecklistFrom(r, id); }
  else toast("ไม่พบรายการนี้แล้ว");
}

/* ---------- ถึงเวลาแล้วขณะเปิดแอป: เด้งไป Checklist ทันที ---------- */
var firedKeys = {};
function fireKey(r){ return r.once ? r.id : r.id + "@" + todayKey() + "@" + r.time; }
function fireInApp(id){
  var r = S.reminders.find(function(x){ return x.id === id; });
  if (!r) return;
  var key = fireKey(r);
  if (firedKeys[key]) return;
  firedKeys[key] = 1;
  S.menuOpen = false; S.detailId = null; S.editingId = null; S.confirmDelete = false;
  openChecklistFrom(r, id);
  try { if (navigator.vibrate) navigator.vibrate([200,100,200]); } catch(e){}
  if (r.once){
    // ทำเครื่องหมายว่าส่งแล้ว: หายจากหน้าโฮม/Reminder และเซิร์ฟเวอร์จะไม่ส่งซ้ำ
    patchReminder(id, { sent_at:new Date().toISOString(), next_fire_at:null }, { sentAt:Date.now(), fireAt:null });
  } else {
    // ทำซ้ำ: ซ่อนจากหน้าโฮมของวันนี้ และเซิร์ฟเวอร์จะข้ามการส่งวันนี้ (พรุ่งนี้กลับมาตามเดิม)
    patchReminder(id, { done_on:todayKey() }, { doneOn:todayKey() });
  }
}
function dueCheck(){
  if (!S.user || S.booting || S.gate || !S.onboarded) return;
  var now = Date.now();
  S.reminders.forEach(function(r){
    var at = null;
    if (r.once){
      if (!r.sentAt && r.fireAt && r.fireAt <= now && now - r.fireAt < 10*60e3) at = r.fireAt;
    } else if (r.doneOn !== todayKey()){
      var last = lastOccurrence(r, now);
      if (last && now - last < 2*60e3) at = last;
    }
    if (at != null) fireInApp(r.id);
  });
}
function finishOnboarding(){
  var t = pad2(S.obHour)+":"+pad2(S.obMinute);
  S.hour = pad2(S.obHour); S.minute = pad2(S.obMinute);
  LS.set("defaultTime", t); LS.set("onboarded", true); S.onboarded = true; render({top:true});
}

    '<div class="chips">'+chips+'</div>';

      (!s.matched?'<p class="note">ยังไม่รู้จักกิจกรรมนี้ เลยแนะนำของที่ควรพกทุกครั้งให้ก่อนนะ</p>':'')+
      '<ul>'+s.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul><button class="btn primary" data-act="openSuggest">เปิด Checklist</button></div>';
  }
  h += '</section>';

  var top = Object.entries(S.stats).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  h += '<section class="card">'+heading("chart","สิ่งที่มักลืม");
  if (!top.length) h += '<p class="note">ยังไม่มีสถิติ ลองเปิด Checklist แล้วกด "เช็คเสร็จแล้ว" ระบบจะนับของที่ยังไม่ได้ติ๊ก</p>';
  else {
    h += top.map(function(e,idx){ var k=e[0], c=e[1], parts = k.indexOf("||")>=0 ? k.split("||") : [null,k];

    h += '<button class="link" data-act="resetStats">รีเซ็ตสถิติ</button>';
  }

function ring(percent){
  var r=34, c=2*Math.PI*r, off=c*(1-percent/100);
  return '<svg class="ring" width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="ความพร้อม '+percent+' เปอร์เซ็นต์"><circle cx="42" cy="42" r="'+r+'" fill="none" stroke="var(--switch-off)" stroke-width="8"/>'+
    '<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 42 42)"/>'+
    '<text x="42" y="48" text-anchor="middle" font-size="19" font-weight="700" fill="var(--text)" font-family="Prompt,sans-serif">'+percent+'%</text></svg>';
}
function viewCheck(){
  var L = listInfo(), items = L.items;
  var done = items.filter(function(_,i){return S.checked[i];}).length, remaining = items.length-done;
  var percent = items.length ? Math.round(done/items.length*100) : 0;
  var cur = S.current;
  var h = '<section class="card"><span class="badge">'+ic(cur.icon,14)+'Smart Suggestion: '+esc(cur.name)+'</span>'+
    '<div class="title-row"><span style="color:var(--primary)">'+ic(iconOf(cur.name)==="list"?cur.icon:iconOf(cur.name),22)+'</span><h2>'+esc(cur.title||cur.name)+' Checklist</h2><span class="pill">'+done+' / '+items.length+'</span></div>'+
    '<div class="progress" role="progressbar" aria-valuenow="'+percent+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+percent+'%"></i></div>';
  items.forEach(function(x,i){
    h += '<div class="item'+(S.checked[i]?' done':'')+'"><button class="cb'+(S.checked[i]?' on':'')+'" data-act="toggle" data-i="'+i+'" role="checkbox" aria-checked="'+!!S.checked[i]+'" aria-label="'+esc(x)+'">'+(S.checked[i]?ic("check",16,3):'')+'</button>'+
      '<button class="t" data-act="toggle" data-i="'+i+'" style="text-align:left">'+esc(x)+'</button><button class="rm" data-act="remove" data-i="'+i+'" aria-label="ลบ '+esc(x)+'">'+ic("x",18)+'</button></div>';
  });
  if (!items.length) h += '<div class="warn">ต้องมีรายการเช็คอย่างน้อย 1 รายการ (เพิ่มของเองด้านล่าง หรือคืนรายการที่ระบบแนะนำ)</div>';
  if (L.removed.length) h += '<button class="link" data-act="restoreDefaults">คืนรายการที่ระบบแนะนำ ('+L.removed.length+')</button>';
  h += '<div class="inrow"><input class="input" id="newItem" data-bind="newItem" data-enter="addItem" value="'+esc(S.newItem)+'" placeholder="เพิ่มของเอง เช่น ร่ม, ยา" enterkeyhint="done"><button class="go" data-act="addItem">+ เพิ่ม</button></div>'+
    '<div class="stats"><div style="flex:1.4">'+ring(percent)+'<small>ความพร้อม</small></div><span class="div"></span><div><b>'+done+'</b><small>เสร็จแล้ว</small></div><span class="div"></span><div><b>'+remaining+'</b><small>คงเหลือ</small></div></div>'+
    '<button class="btn primary" data-act="confirm">เช็คเสร็จแล้ว</button>'+
    '<button class="btn secondary" data-act="nav" data-s="reminder">'+ic("bell",18)+'ตั้ง Reminder</button>'+
    '<button class="btn secondary" data-act="nav" data-s="home">'+ic("back",18)+'กลับหน้าหลัก</button></section>';
  return h;
}

  return '<button class="nav-btn'+(on?' on':'')+'" data-act="nav" data-s="'+id+'" aria-label="'+label+'"'+(on?' aria-current="page"':'')+'>'+ic(icon,26)+'</button>';
}

function render(opts){
  opts = opts || {};
  var app = document.getElementById("app"), y = window.scrollY, html;
  if (S.gate){
    html = viewGate();
  } else if (S.booting){
    html = viewBoot();
  } else if (!S.onboarded){
    html = '<main style="min-height:100vh;justify-content:center;padding-block:24px">'+viewOnboarding()+'</main>';
  } else {
    var body = S.screen==="home" ? viewHome() : S.screen==="check" ? viewCheck() : S.screen==="reminder" ? viewReminder() : viewSettings();
    html = '<header class="header"><div class="header-in"><div class="brand"><h1><img class="brand-logo" src="/icons/icon-192.png" alt="">Smart Reminder</h1><p>คิดก่อนลืม — ผู้ช่วยเตรียมตัวอัจฉริยะ</p></div>'+
      '<button class="round" data-act="nav" data-s="reminder" aria-label="การแจ้งเตือน">'+ic("bell",22)+(activeReminders().length?'<span class="dot"></span>':'')+'</button>'+
      '<button data-act="openMenu" aria-label="เมนูโปรไฟล์">'+avatarHtml(AVATARS[S.profile.avatar]||AVATARS[0],42)+'</button></div></header>'+
      '<main class="shell">'+body+'</main>'+
      '<nav class="nav-pill" aria-label="เมนูหลัก"><div class="nav-glass">'+navBtn("home","home","หน้าหลัก")+navBtn("check","checksq","Checklist")+navBtn("reminder","bell","Reminder")+'</div></nav>';
  }
  app.innerHTML = html + viewModals();
  window.scrollTo(0, opts.top ? 0 : y);
  initWheels();
  if (focusId){ var el = document.getElementById(focusId); if (el){ el.focus(); } focusId = null; }
}

/* ---------- wheels ---------- */
var ITEM = 48;
function initWheels(){
  document.querySelectorAll(".wheel").forEach(function(w){
    var kind = w.dataset.k, val = +w.dataset.v, t;
    w.scrollTop = val*ITEM;
    w.addEventListener("scroll", function(){
      clearTimeout(t);
      t = setTimeout(function(){
        var n = w.children.length, idx = Math.min(n-1, Math.max(0, Math.round(w.scrollTop/ITEM)));
        Array.prototype.forEach.call(w.children, function(c,i){ c.classList.toggle("on", i===idx); });
        if (kind==="h") S.hour = pad2(idx); else if (kind==="m") S.minute = pad2(idx);
        else if (kind==="oh") S.obHour = idx; else if (kind==="om") S.obMinute = idx;
      }, 90);
    });
  });
}

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("scrim") && e.target !== el) return;
  var a = el.dataset.act, i = +el.dataset.i, id = el.dataset.id;
  switch(a){
    case "nav": S.screen = el.dataset.s; S.menuOpen = false; render({top:true}); break;
    case "openMenu": S.menuOpen = true; render(); break;
    case "closeMenu": S.menuOpen = false; render(); break;
    case "openSettings": S.nameDraft = S.profile.name; go("settings"); break;
    case "theme": setTheme(el.dataset.v); break;
    case "activity": selectActivity(i); break;
    case "toggle": toggleItem(i); break;
    case "remove": removeItem(i); break;
    case "addItem": addItem(); break;
    case "restoreDefaults": restoreDefaults(); break;
    case "confirm": confirmChecked(); break;
    case "suggest": runSuggest(S.query); break;
    case "chip": S.query = el.dataset.n; runSuggest(el.dataset.n); break;
    case "openSuggest": openAsChecklist(); break;
    case "resetStats": S.stats = {}; LS.set("forgotStats", {}); render(); break;
    case "more": S.showAll = !S.showAll; render(); break;
    case "detail": S.detailId = id; render(); break;
    case "closeDetail": S.detailId = null; render(); break;
    case "openList": openChecklistFrom(null, id); break;
    case "startEdit": startEdit(id); break;
    case "delReminder": deleteReminder(id); break;
    case "quick": setQuickTime(+el.dataset.m); break;
    case "toggleRepeat": S.repeat = !S.repeat; render(); break;
    case "day": var wd = +el.dataset.wd; S.days = S.days.indexOf(wd)>=0 ? S.days.filter(function(x){return x!==wd;}) : S.days.concat([wd]); render(); break;
    case "addReminder": addReminder(); break;
    case "cancelEdit": cancelEdit(); break;
    case "addEditItem": addEditItem(); break;
    case "removeEditItem": S.editItems = S.editItems.filter(function(_,idx){return idx!==i;}); render(); break;
    case "avatar": saveProfile(Object.assign({}, S.profile, {avatar:i})); render(); break;
    case "saveName": saveName(); break;
    case "obGo": S.obStep = +el.dataset.to; render({top:true}); break;
    case "obPerm": enablePush(); break;
    case "togglePush": togglePush(); break;
    case "askDelete": S.confirmDelete = true; render(); break;
    case "cancelDelete": if (!S.deleting){ S.confirmDelete = false; render(); } break;
    case "doDelete": deleteEverything(); break;
    case "skipInstall": LS.set("skipInstall", true); S.gate = false; boot(); break;
    case "retryBoot": boot(); break;
    case "obFinish": finishOnboarding(); break;
  }
});
document.addEventListener("input", function(e){ var k = e.target.dataset && e.target.dataset.bind; if (k) S[k] = e.target.value; });
document.addEventListener("keydown", function(e){
  if (e.key==="Enter" && e.target.dataset && e.target.dataset.enter){
    e.preventDefault();
    var m = e.target.dataset.enter;
    if (m==="suggest") runSuggest(S.query); else if (m==="addItem") addItem(); else if (m==="addEditItem") addEditItem(); else if (m==="saveName") saveName();
  }
});
document.addEventListener("visibilitychange", function(){ if (!document.hidden && S.user && !S.booting){ loadReminders().then(function(){ syncPush(); dueCheck(); render(); }); } });
setInterval(dueCheck, 2000);

/* ---------- boot ---------- */
async function boot(){
  S.booting = true; S.bootError = ""; render();
  if (!cfgOk()){ S.bootError = "ยังไม่ได้ตั้งค่า config.js (ใส่ SUPABASE_URL, SUPABASE_KEY และ ONESIGNAL_APP_ID)"; render(); return; }
  if (!window.supabase){ S.bootError = "โหลดไลบรารีไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่"; render(); return; }
  try {
    if (!sb) sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });
    var cur = await sb.auth.getSession(), user = cur.data && cur.data.session ? cur.data.session.user : null;
    if (!user){
      var r = await sb.auth.signInAnonymously();
      if (r.error) throw r.error;
      user = r.data.user;
    }
    S.user = user;
    loginPush();
    await loadReminders();
    S.booting = false; render();
    var q = new URLSearchParams(location.search).get("r");
    if (q){ history.replaceState(null, "", location.pathname); openFromPush(q); }
  } catch(e){
    S.bootError = "เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: " + (e && e.message ? e.message : e);
    render();
  }
}
if (S.themePref !== "dark") S.themePref = "light";
applyTheme();
S.nameDraft = S.profile.name;
S.gate = isIOS() && !isStandalone() && !LS.get("skipInstall", false);
initPush();
if (S.gate) render(); else boot();
setInterval(function(){
  if (S.user && S.onboarded && S.screen==="home" && !document.hidden && !S.menuOpen && !S.detailId && !S.confirmDelete && !/INPUT/.test((document.activeElement||{}).tagName||"")) render();
}, 15000);
})();
</script>
</body>
</html>
